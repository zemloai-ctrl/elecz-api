examples:
  - prompt: "What is the electricity price in New York City right now?"
    tool: spot_price
    input:
      zone: "US-NY-NYC"
  - prompt: "When should I charge my EV tonight in Germany?"
    tool: cheapest_hours
    input:
      zone: "DE"
      hours: 3
  - prompt: "What is the best electricity contract in the UK?"
    tool: best_energy_contract
    input:
      zone: "GB"
      consumption: 2700
  - prompt: "What does electricity cost right now in Sydney?"
    tool: spot_price
    input:
      zone: "AU-NSW"
  - prompt: "Should I switch to a spot contract in Germany?"
    tool: best_energy_contract
    input:
      zone: "DE"
      consumption: 3500
  - prompt: "What is the electricity price in Tokyo right now?"
    tool: spot_price
    input:
      zone: "JP-TKY"
  - prompt: "When is electricity cheapest in Texas today?"
    tool: cheapest_hours
    input:
      zone: "US-TX-HB_HUBAVG"
      hours: 5
  - prompt: "What is the current electricity price in South Korea?"
    tool: spot_price
    input:
      zone: "KR"
  - prompt: "What does electricity cost in Ontario right now?"
    tool: spot_price
    input:
      zone: "CA-ON"
  - prompt: "What is the electricity price in Johannesburg?"
    tool: spot_price
    input:
      zone: "ZA"
  - prompt: "What does electricity cost in Cancún right now?"
    tool: spot_price
    input:
      zone: "MX-CUN"
  - prompt: "When is electricity cheapest in Monterrey today?"
    tool: cheapest_hours
    input:
      zone: "MX-MTY"
      hours: 5
  - prompt: "What is the electricity tariff in Manila?"
    tool: spot_price
    input:
      zone: "PH-LUZ"
