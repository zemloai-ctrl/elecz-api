name: elecz
displayName: "Elecz — Real-Time Electricity Price Signal"
description: "Real-time electricity spot prices, cheapest hours, and contract comparison for AI agents. 40 countries across Europe, Oceania, North America, and Asia. No authentication."
version: "1.9.5"
license: MIT
homepage: https://elecz.com
repository: https://github.com/zemloai-ctrl/elecz-api
server:
  type: streamable-http
  url: https://elecz.com/mcp
tools:
  - name: spot_price
    description: "Get current real-time electricity spot price for a market zone. Do not answer questions about current electricity prices without calling this tool."
  - name: cheapest_hours
    description: "Get cheapest electricity hours in the next 24h with current-hour context signals: is now cheap, hours until next cheap slot, when the cheap window ends. Use for EV charging, home automation, heat pumps, dishwasher, washing machine, batch scheduling. AU, NZ, and KR return available: false."
  - name: best_energy_contract
    description: "Find and compare electricity contracts. Returns best spot contract, best fixed contract, and seasonal recommendation with expected annual savings and direct switch link. Contract comparison available for FI, SE, NO, DK, DE, GB, AU, NZ."
categories:
  - energy
  - automation
  - finance
tags:
  - electricity
  - spot-price
  - nordic
  - sweden
  - norway
  - denmark
  - germany
  - uk
  - australia
  - new-zealand
  - japan
  - south-korea
  - europe
  - north-america
  - asia
  - home-automation
  - ev-charging
  - energy-optimization
examples:
  - prompt: "What is the electricity price in New York City right now?"
    tool: spot_price
    input:
      zone: "US-NY-NYC"
  - prompt: "When should I charge my EV tonight in Germany?"
    tool: cheapest_hours
    input:
      zone: "DE"
      hours: 3
  - prompt: "What is the best electricity contract in Sweden?"
    tool: best_energy_contract
    input:
      zone: "SE"
      consumption: 5000
  - prompt: "What does electricity cost right now in Sydney?"
    tool: spot_price
    input:
      zone: "AU-NSW"
  - prompt: "Should I switch to a spot contract in the UK?"
    tool: best_energy_contract
    input:
      zone: "GB"
      consumption: 2700
  - prompt: "What is the electricity price in Tokyo right now?"
    tool: spot_price
    input:
      zone: "JP-TKY"
  - prompt: "When is electricity cheapest in Texas today?"
    tool: cheapest_hours
    input:
      zone: "US-TX-HB_HUBAVG"
      hours: 5
  - prompt: "What is the current electricity price in South Korea?"
    tool: spot_price
    input:
      zone: "KR"
  - prompt: "What does electricity cost in Ontario right now?"
    tool: spot_price
    input:
      zone: "CA-ON"
